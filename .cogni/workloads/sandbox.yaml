# Validation fixture for cogni-dao/cogni#3214 (Poly shape): a worker workload beside a companion app.
apiVersion: score.dev/v1b1
metadata:
  name: sandbox
  annotations:
    cogni.dev/exclusive: "false"
    cogni.dev/ephemeral-storage: 5Gi
containers:
  sandbox:
    image: ghcr.io/cogni-dao/red-sandbox@sha256:34118061741a75bd08b134cfd8a1614044ec8460a198ddd81bb2ddb52cdbebc0
    resources:
      requests:
        cpu: "1"
        memory: 1024Mi
    readinessProbe:
      httpGet:
        path: /readyz
        port: 8080
service:
  ports:
    web:
      port: 80
      targetPort: 8080
resources:
  web:
    type: route
    params:
      host: spawny-boi-sandbox.cogni-testing.org
      path: /
      port: 80
